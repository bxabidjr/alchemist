*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI","Noto Sans Bengali","Kalpurush",system-ui,sans-serif}

main{display:grid;grid-template-columns:260px minmax(0,1fr) 340px;gap:12px;padding:12px;height:calc(100vh - 50px);height:calc(100dvh - 50px)}
aside,#info{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:12px;overflow:auto;min-height:0}
#view{display:flex;flex-direction:column;min-height:0;border:1px solid var(--bd);border-radius:8px;background:var(--pn);overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--bd)}
.bar label{font-size:12px;color:var(--mu);display:flex;gap:5px;align-items:center}
#cw{position:relative;flex:1;min-height:260px;background:var(--cv)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#legend{position:absolute;bottom:6px;left:8px;right:8px;font-size:11px;color:var(--mu);display:flex;flex-wrap:wrap;gap:2px 12px;pointer-events:none}
#legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:4px;vertical-align:middle}
#note{position:absolute;bottom:34px;left:8px;right:8px;font-size:12px;color:var(--ac);pointer-events:none}
.g{margin-top:8px}
.chip{display:inline-flex;align-items:center;margin:2px;padding:2px 9px;border-radius:12px;font-size:12px;cursor:pointer;border:1px solid var(--bd)}
#list button{display:block;width:100%;text-align:left;margin:4px 0}
#list button.on small,#rlist button.on small{color:#04201e}#rlist button{display:block;width:100%;text-align:left;margin:4px 0}#enc{display:block;margin:4px 0}
small,.mu{color:var(--mu)}
#info h2{margin:0;font:700 22px Georgia,"Noto Sans Bengali",serif}
#info h3{margin:14px 0 2px;font-size:13px;color:var(--ac)}
#info p{margin:2px 0}.f{font-size:20px;margin:2px 0}
details{margin-top:12px}summary{cursor:pointer;font-weight:600}
textarea{width:100%;height:80px;font-family:monospace;font-size:12px}
@media(max-width:1150px){main{grid-template-columns:230px minmax(0,1fr) 280px}}
@media(max-width:900px){ /* phones & small tablets: viewer first, then picker, then info */

@media(pointer:coarse){button,select,.chip{min-height:38px}.chip{padding:4px 12px}input[type=range]{width:110px}}

.tabs{display:flex;gap:4px}.tabs button{font-weight:600}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb td,.tb th{border-bottom:1px solid var(--bd);padding:3px 6px;text-align:left}
.sp{margin:2px}
@media(max-width:900px){header{flex-wrap:wrap;gap:6px}}

const V=(x,y,z)=>new THREE.Vector3(x,y,z), nrm=(v,l)=>v.normalize().multiplyScalar(l);

function glucose(){ // schematic beta-D-glucopyranose chair-like ring
 const at=[],add=(e,v)=>at.push([e,v.x,v.y,v.z]);
 for(let k=0;k<6;k++){
  const th=k*Math.PI/3,r=V(Math.cos(th),Math.sin(th),0),t=V(-Math.sin(th),Math.cos(th),0),zs=k%2?1:-1;
  const cm=(a,b,z)=>V(a*r.x+b*t.x,a*r.y+b*t.y,z), P=cm(1.45,0,.25*zs);
  add(k?'C':'O',P); if(!k)continue;
  add('H',P.clone().add(nrm(cm(.2,0,zs),1.09)));              // axial H
  const eq=P.clone().add(nrm(cm(.9,0,-.4*zs),k<5?1.43:1.52)); // equatorial substituent
  if(k<5){add('O',eq);add('H',eq.clone().add(nrm(cm(.6,.5,.3),.96)));}
  else{ // C6 = CH2OH
   add('C',eq);add('H',eq.clone().add(nrm(cm(.2,.5,.6),1.09)));add('H',eq.clone().add(nrm(cm(.2,-.5,-.6),1.09)));
   const o=eq.clone().add(nrm(cm(1,.3,.2),1.43));add('O',o);add('H',o.clone().add(nrm(cm(.5,.6,0),.96)));}
 }
 return at;
}

const benz=[];for(let k=0;k<6;k++){const a=k*Math.PI/3;benz.push(['C',1.39*Math.cos(a),1.39*Math.sin(a),0])}
for(let k=0;k<6;k++){const a=k*Math.PI/3;benz.push(['H',2.48*Math.cos(a),2.48*Math.sin(a),0])}

{n:'Water',f:'H<sub>2</sub>O',iu:'oxidane',at:A("O 0 0 0;H .76 .59 0;H -.76 .59 0"),ch:0,org:0,

{n:'Methane',f:'CH<sub>4</sub>',iu:'methane',at:A("C 0 0 0;H .63 .63 .63;H -.63 -.63 .63;H -.63 .63 -.63;H .63 -.63 -.63"),ch:0,org:1,
 i:['sp³ carbon, four C–H σ bonds, tetrahedral 109.5°. Non-polar.','Achiral; optically inactive.','Natural-gas fuel, hydrogen production, chemical feedstock.','Made by methanogenic microbes; a potent greenhouse gas.']},
{n:'Ammonia',f:'NH<sub>3</sub>',iu:'azane',at:A("N 0 0 0;H .94 -.33 0;H -.47 -.33 .81;H -.47 -.33 -.81"),ch:0,org:0,
 i:['sp³ N with one lone pair; trigonal pyramidal, ≈107°. Polar; forms hydrogen bonds.','Achiral (N inverts rapidly).','Fertilisers (Haber–Bosch), refrigerant, nitric acid.','Central to nitrogen metabolism and the urea cycle; a weak base.']},
{n:'Carbon dioxide',f:'CO<sub>2</sub>',iu:'carbon dioxide',at:A("C 0 0 0;O 1.16 0 0;O -1.16 0 0"),o:{'0-1':2,'0-2':2},ch:0,org:0,
 i:['sp carbon, two C=O bonds (σ + π), linear 180°. Bonds are polar but the molecule is non-polar.','Achiral; optically inactive.','Carbonated drinks, dry ice, fire extinguishers, supercritical solvent.','Photosynthesis substrate; greenhouse gas; part of the blood bicarbonate buffer.']},

['Bent molecule in which oxygen pulls bonding electrons toward itself, so the molecule has a dipole. Each molecule can form up to four hydrogen bonds, which explains why ice floats, its high surface tension and its power to dissolve salts and sugars.','Oceans, rivers, rain, ice caps, water vapour in air, and about 60% of the human body.'],

/* Work out bonds from geometry (distance rule) and tag each molecule */
function prep(m){
 const a=m.at,B=[],o=m.o||{};
 for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){
  const p=a[i],q=a[j],d=Math.hypot(p[1]-q[1],p[2]-q[2],p[3]-q[3]),na=(p[0]=='Na')+(q[0]=='Na');
  if(na==2)continue;
  if(d<1.2*(E[p[0]][0]+E[q[0]][0])){const k=i+'-'+j;B.push({i,j,t:na?'ion':o[k]=='c'?'co':'sdt'[(o[k]||1)-1]});}
  else if(m.hb&&d>1.5&&d<2.4&&((p[0]=='H'&&'ON'.includes(q[0]))||(q[0]=='H'&&'ON'.includes(p[0]))))B.push({i,j,t:'hb'});
 }
 m.bonds=B;m.tags=new Set([m.ch?'Chiral':'Achiral',m.org?'Organic':'Inorganic']);
 B.forEach(b=>m.tags.add({ion:'Ionic',hb:'Hydrogen',co:'Coordinate'}[b.t]||'Covalent'));
 m.g=a.map((_,i)=>i); // group id per atom (radical = heavy atom + its hydrogens)
 B.forEach(b=>{if(b.t=='hb'||b.t=='ion')return;const h=a[b.i][0]=='H',k=a[b.j][0]=='H';if(h&&!k)m.g[b.i]=b.j;else if(k&&!h)m.g[b.j]=b.i;});
 const gc={};m.g.forEach((g,i)=>(gc[g]=gc[g]||[]).push(a[i][0]));
 m.rad=Object.values(gc).map(l=>{const c={};l.forEach(e=>c[e]=(c[e]||0)+1);return Object.keys(c).sort((x,y)=>(x=='H')-(y=='H')).map(e=>e+(c[e]>1?c[e]:'')).join('');});
}

 const d=b.clone().sub(a),len=d.length(),m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8),new THREE.MeshPhongMaterial({color:col}));
 m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(YA,d.normalize());g.add(m);
}
function bond(g,a,b,t){ // draws single/double/triple as 1-3 cylinders, ionic/H/coordinate as dashes
 const d=b.clone().sub(a),len=d.length(),u=d.clone().normalize(),col=BT[t][0],w=mode=='wire'?.5:1;
 let p=u.clone().cross(Math.abs(u.y)<.9?YA:V(1,0,0)).normalize();
 if('ion hb co'.includes(t)){const n=Math.max(2,Math.floor(len/.32));
  for(let k=0;k<n;k++)cyl(g,a.clone().addScaledVector(u,len*(k+.15)/n),a.clone().addScaledVector(u,len*(k+.65)/n),(t=='ion'?.07:.05)*w,col);return;}
 const n={s:1,d:2,t:3}[t],off=n==1?[0]:n==2?[-.1,.1]:[-.17,0,.17],r=[0,.07,.055,.045][n]*w;
 off.forEach(o=>cyl(g,a.clone().addScaledVector(p,o),b.clone().addScaledVector(p,o),r,col));
}
const lt={};
function label(el){
 if(!lt[el]){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  x.font='bold 38px sans-serif';x.textAlign='center';x.textBaseline='middle';x.lineWidth=7;x.strokeStyle='#000';x.fillStyle='#fff';
  x.strokeText(el,32,34);x.fillText(el,32,34);lt[el]=new THREE.CanvasTexture(c);}
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:lt[el],depthTest:false,transparent:true}));s.renderOrder=9;s.scale.set(.7,.7,1);return s;
}
function build(m,mir){ // returns a centred group for molecule m (mirrored through x if mir)
 const g=new THREE.Group(),P=m.at.map(a=>V(mir?-a[1]:a[1],a[2],a[3]));
 const c=P.reduce((s,p)=>s.add(p),V(0,0,0)).multiplyScalar(1/P.length);P.forEach(p=>p.sub(c));
 if(ex!=1){const gc={};m.g.forEach((g,i)=>{const o=gc[g]=gc[g]||{s:V(0,0,0),n:0};o.s.add(P[i]);o.n++;});
  const sh=m.at.map((_,i)=>{const o=gc[m.g[i]];return o.s.clone().multiplyScalar((ex-1)/o.n);});P.forEach((p,i)=>p.add(sh[i]));} // move each radical away from / toward the centre
 m.at.forEach((a,i)=>{const e=E[a[0]],r=mode=='cpk'?e[1]*.85:mode=='wire'?.08:e[1]*.25;
  const s=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),new THREE.MeshPhongMaterial({color:e[2],shininess:70}));
  s.position.copy(P[i]);g.add(s);
  if($('#lab').checked){const l=label(a[0]);l.position.copy(P[i]);g.add(l);}});
 if(mode!='cpk')m.bonds.forEach(b=>bond(g,P[b.i],P[b.j],b.t));
 g.userData.r=Math.max(...P.map(p=>p.length()))+1.5;return g;
}
function draw(k){if(view=='rx'){rxDraw(k);return;}
 [pA,pB].forEach(p=>{while(p.children.length)p.remove(p.children[0]);});
 const a=build(cur,false);pA.add(a);pB.visible=mirror;
 let r=a.userData.r,off=0;
 if(mirror){pB.add(build(cur,true));off=r+.8;}
 pA.position.x=-off;pB.position.x=off;
 const asp=cam.aspect;if(!k)cam.position.z=Math.max(7,((mirror?(off+r)*2.1:r*2.6)+3)*(asp<1?1.5:1));
 $('#note').textContent=mirror?(cur.ch?t('noteC'):t('noteA')):'';
 $('#tgw').hidden=!mirror;
}

/* ===== Interaction: drag = rotate, wheel / pinch = zoom (mouse + touch) ===== */
const pts=new Map();let pd=0;
const zoom=f=>{cam.position.z=Math.min(70,Math.max(3,cam.position.z*f));};
function rot(dx,dy){const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(dy*.01,dx*.01,0));
 if(view=='rx'){rG.quaternion.premultiply(q);return;}
 if(!(mirror&&$('#tgt').value=='mirror'))pA.quaternion.premultiply(q);
 if(mirror)pB.quaternion.premultiply(q);}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,e);});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);
 if(pts.size==1)rot(e.clientX-p.clientX,e.clientY-p.clientY);
 pts.set(e.pointerId,e);
 if(pts.size==2){const [a,b]=[...pts.values()],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd)zoom(pd/d);pd=d;}});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>{pts.delete(e.pointerId);pd=0;}));
cv.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.1:.9);},{passive:false});

function size(){const w=$('#cw').clientWidth,h=$('#cw').clientHeight;ren.setPixelRatio(Math.min(devicePixelRatio||1,2));ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',()=>{size();draw();});

function list(){ // search + filters + atom picker; returns the two suggestion groups
 const qs=$('#q').value.toLowerCase().replace(/[₀-₉]/g,c=>c.charCodeAt(0)-8320).split(/\s+/).filter(Boolean);
 const sc=m=>qs.every(w=>key(m).includes(w))?0:1;
 const base=M.filter(m=>qs.every(w=>key(m).includes(w)||ws(hay(m),w))&&[bt,pr].every(x=>!x.size||[...x].some(y=>m.tags.has(y)))).sort((a,b)=>sc(a)-sc(b));
 const want=[...as.keys()];let g1=[],g2=base;
 if(want.length){g1=[];g2=[];base.forEach(m=>{const c={};m.at.forEach(a=>c[a[0]]=(c[a[0]]||0)+1);
  if(want.every(e=>(c[e]||0)>=as.get(e)))(Object.keys(c).length==want.length?g1:g2).push(m);});}

 rows(g1,want.length&&'t1');rows(g2,want.length&&'t2');
 const n=g1.length+g2.length;

  return{c:+(q[1]||1),f,m:M.find(m=>FS(m)==f||m.n.toLowerCase()==f.toLowerCase())};});

 x.r.forEach(s=>{const c=comp(s.m);for(const e in c)L[e]=(L[e]||0)+c[e]*s.c;ml+=mm(s.m)*s.c;});
 x.p.forEach(s=>{const c=comp(s.m);for(const e in c)R[e]=(R[e]||0)+c[e]*s.c;mr+=mm(s.m)*s.c;});
 const els=[...new Set([...Object.keys(L),...Object.keys(R)])];

 (function go(i,sum){if(best&&sum>=best.s)return;if(i==V.length){if(els.every((_,k)=>Math.abs(c.reduce((t,ci,j)=>t+ci*V[j][k],0))<1e-6))best={s:sum,c:[...c]};return;}
  for(let n=1;n<=12;n++){c[i]=n;go(i+1,sum+n);}})(0,0);return best&&best.c;}

 $('#cmsg').textContent='';rxSel({n:t('custom'),eq:$('#ceq').value,r:q.r,p:q.p,t:'',u:'',m:'',c:''});}
$('#tm').onclick=()=>setView('mol');$('#tr').onclick=()=>setView('rx');
$('#cld').onclick=()=>loadEq(0);$('#cab').onclick=()=>loadEq(1);$('#rq').oninput=rxList;
$('#play').onclick=()=>{playing=!playing;$('#play').textContent=t(playing?'pause':'play');};
$('#prg').oninput=rxPose;

size();apply();sel(M[0]);
</script>
